<!doctype html><meta charset="utf-8"><title>JarvOS — marca</title>
<style>
  :root { color-scheme: dark; --bg:#0d0f14; --fg:#e6e9ef; --dim:#7d8595; --accent:#7aa2f7; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:15px/1.5 "Rubik",system-ui,sans-serif; padding:48px 40px 80px; }
  h1 { font-size:20px; font-weight:500; letter-spacing:.02em; margin:0 0 4px; }
  p.sub { color:var(--dim); margin:0 0 40px; }
  .row { display:grid; grid-template-columns:150px 1fr; gap:32px; align-items:center;
         padding:28px 0; border-top:1px solid #1c2029; }
  .meta h2 { font-size:16px; margin:0 0 6px; font-weight:500; }
  .meta p { margin:0; color:var(--dim); font-size:13px; }
  .sizes { display:flex; align-items:center; gap:36px; flex-wrap:wrap; }
  .tile { display:flex; flex-direction:column; align-items:center; gap:8px; }
  .tile span { font-size:11px; color:var(--dim); font-variant-numeric:tabular-nums; }
  .light { background:#f4f5f7; color:#12141a; padding:14px; border-radius:12px; }
  .accent { color:var(--accent); }
  .lockup { display:flex; align-items:center; gap:14px; }
  .lockup b { font-size:26px; font-weight:500; letter-spacing:.14em; }
</style>
<h1>JarvOS — quatro direções de marca</h1>
<p class="sub">monocromáticas por construção: herdam a cor do Material You, funcionam em 1 bit, no console e em 16 px.</p>
<div id="rows"></div>
<script>
const marks = [
  ["A","Hook","o J reduzido ao gancho. Um traço, nada mais."],
  ["B","Aperture","o J recortado de um tile sólido. Forma de ícone de app."],
  ["C","Iris","anel aberto com o J dentro — o agente que enxerga a tela."],
  ["D","Hook + órbita","o J com um satélite. AI-native dito baixinho."]
];
Promise.all(marks.map(([k])=>fetch(`mark-${k.toLowerCase()}.svg`).then(r=>r.text())))
.then(svgs=>{
  document.getElementById("rows").innerHTML = marks.map(([k,name,desc],i)=>{
    const s = (px,cls="") => `<div class="tile ${cls}"><div style="width:${px}px;height:${px}px">${svgs[i].replace("<svg","<svg style='width:100%;height:100%;display:block'")}</div><span>${px}px</span></div>`;
    return `<div class="row">
      <div class="meta"><h2>${k} · ${name}</h2><p>${desc}</p></div>
      <div class="sizes">${s(96)}${s(48)}${s(24)}${s(64,"light")}
        <div class="tile accent">${s(64).replace(/<span>.*<\/span>/,"<span>cor</span>")}</div>
        <div class="lockup">${s(40).replace(/<span>.*<\/span>/,"")}<b>JARVOS</b></div>
      </div></div>`;
  }).join("");
});
</script>
