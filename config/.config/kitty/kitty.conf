# Font
font_family      JetBrains Mono Nerd Font
#bold_font        JetBrains Mono Nerd Font Bold
font_size 12.0

# CJK fallback — JetBrainsMono lacks most CJK glyphs; route the Unicode
# CJK ranges through Noto Sans CJK SC so 调离反为 etc. render in chat.
symbol_map U+3000-U+30FF Noto Sans CJK SC
symbol_map U+31C0-U+31EF Noto Sans CJK SC
symbol_map U+3200-U+33FF Noto Sans CJK SC
symbol_map U+3400-U+4DBF Noto Sans CJK SC
symbol_map U+4E00-U+9FFF Noto Sans CJK SC
symbol_map U+F900-U+FAFF Noto Sans CJK SC
symbol_map U+FE30-U+FE4F Noto Sans CJK SC
symbol_map U+FF00-U+FFEF Noto Sans CJK SC

# Opacity
# background_opacity 0.9

# Scrollback size
scrollback_lines 10000

# Cursor
cursor_shape beam
cursor_trail 1

# Padding
window_margin_width 20

# No stupid close confirmation
confirm_os_window_close 0

# Use fish shell
shell fish

# Copy
map ctrl+c    copy_or_interrupt

# Search
map ctrl+f launch --type=overlay --stdin-source=@screen_scrollback --stdin-add-formatting --copy-env ~/.config/kitty/fzf_search.sh

# Scroll & Zoom
map page_up    scroll_page_up
map page_down    scroll_page_down

map ctrl+plus  change_font_size all +1
map ctrl+equal  change_font_size all +1
map ctrl+kp_add  change_font_size all +1
map ctrl+minus       change_font_size all -1
map ctrl+underscore       change_font_size all -1
map ctrl+kp_subtract       change_font_size all -1
map ctrl+0 change_font_size all 0
map ctrl+kp_0 change_font_size all 0


# Theme
foreground              #F4DED5
background              #1C110C
selection_foreground    #1C110C
selection_background    #F4DED5
cursor                  #F4DED5
cursor_text_color       #1C110C

color0 #241812
color8 #C7B4BC
color1 #AD73FF
color9 #D5B1FF
color2 #FFDDE6
color10 #F2FFFD
color3 #63DFD6
color11 #FFFFFF
color4 #8FACD5
color12 #CBDEF7
color5 #A5A3EE
color13 #D9D6FF
color6 #8CD2F3
color14 #F6FCFF
color7 #ECD1D8
