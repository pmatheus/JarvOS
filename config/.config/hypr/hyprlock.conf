$col_text             = rgba(f5f7faEE)
$col_text_dim         = rgba(c0c8d099)
$col_text_subtle      = rgba(80869566)
$col_text_minimal     = rgba(50556044)
$col_caps             = rgba(ffb024CC)
$col_fail             = rgba(ff4d6bDD)
$col_input_fill       = rgba(00000077)
$col_input_border     = rgba(ffffff15)
$col_frame            = rgba(ffffff14)
$col_separator        = rgba(ffffff28)

$f_thin               = JetBrainsMono Nerd Font ExtraLight
$f_heavy              = JetBrainsMono Nerd Font ExtraBold
$f_mono               = JetBrainsMono Nerd Font Light
$f_display            = Gabarito Black
$f_display_med        = Gabarito Medium
$f_cjk                = Noto Serif CJK SC SemiBold

$wallpaper            = /home/user/.cache/hyprlock-wallpaper
$helpers              = /home/user/.config/hypr/hyprlock

general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
}

animations {
    enabled = true
    bezier = quick,        0.15, 1.00, 0.10, 1.00
    bezier = expressive,   0.30, 0.00, 0.10, 1.00
    animation = fadeIn,            1, 5, expressive
    animation = fadeOut,           1, 7, expressive
    animation = inputFieldDots,    1, 2, quick
    animation = inputFieldColors,  1, 4, quick
}

background {
    monitor =
    path = $wallpaper
    blur_size = 8
    blur_passes = 3
    contrast = 1.10
    brightness = 0.28
    vibrancy = 0.06
    vibrancy_darkness = 0.0
}

shape {
    monitor =
    size = 1920, 1080
    position = 0, 0
    halign = center
    valign = center
    color = rgba(000000A8)
    rounding = 0
    border_size = 0
    xray = false
}

shape {
    monitor =
    size = 1920, 1
    position = 0, 36
    halign = center
    valign = top
    color = $col_frame
    rounding = 0
    border_size = 0
}

shape {
    monitor =
    size = 1920, 1
    position = 0, 36
    halign = center
    valign = bottom
    color = $col_frame
    rounding = 0
    border_size = 0
}

label {
    monitor =
    text = cmd[update:1000] date +%H
    color = $col_text
    font_size = 240
    font_family = $f_thin
    position = -200, 130
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +%M
    color = $col_text
    font_size = 240
    font_family = $f_heavy
    position = -200, -160
    halign = center
    valign = center
}

shape {
    monitor =
    size = 1, 360
    position = 30, -10
    halign = center
    valign = center
    color = $col_separator
    rounding = 0
    border_size = 0
}

label {
    monitor =
    text = cmd[update:60000] $helpers/dayname.sh
    color = $col_text_dim
    font_size = 16
    font_family = $f_mono
    position = 220, 160
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] $helpers/daynum.sh
    color = $col_text
    font_size = 116
    font_family = $f_display
    position = 220, 30
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] $helpers/monthname.sh
    color = $col_text_dim
    font_size = 16
    font_family = $f_mono
    position = 220, -120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:3600000] date +%Y
    color = $col_text_subtle
    font_size = 12
    font_family = $f_mono
    position = 220, -160
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 38
    outline_thickness = 1
    dots_size = 0.16
    dots_spacing = 0.55
    dots_center = true
    dots_rounding = -1

    inner_color = $col_input_fill
    outer_color = $col_input_border
    check_color = $col_text
    fail_color = $col_fail
    capslock_color = $col_caps
    numlock_color = $col_text_dim
    bothlock_color = $col_caps
    invert_numlock = false

    font_color = $col_text
    fade_on_empty = true
    fade_timeout = 1500
    placeholder_text =
    hide_input = false
    rounding = 14

    fail_text = <span foreground="##ff4d6bdd">$ATTEMPTS</span>

    position = 0, 220
    halign = center
    valign = bottom
}

label {
    monitor =
    text = cmd[update:250] $helpers/check-capslock.sh
    color = $col_caps
    font_size = 11
    font_family = $f_mono
    position = 0, 270
    halign = center
    valign = bottom
}

label {
    monitor =
    text = cmd[update:240000] $helpers/proverb.sh cn
    color = $col_text_dim
    font_size = 22
    font_family = $f_cjk
    position = 0, 64
    halign = center
    valign = bottom
}

label {
    monitor =
    text = cmd[update:240000] $helpers/proverb.sh en
    color = $col_text_subtle
    font_size = 11
    font_family = $f_mono
    position = 0, 32
    halign = center
    valign = bottom
}
