$col_card_fill        = rgba(0e131fAA)
$col_card_border      = rgba(7c93b430)
$col_chip_fill        = rgba(0e131f88)
$col_chip_border      = rgba(7c93b428)
$col_text             = rgba(eaeef5FF)
$col_text_dim         = rgba(8a93afFF)
$col_text_subtle      = rgba(606981FF)
$col_accent           = rgba(64d8ffFF)
$col_accent_2         = rgba(b5a4faFF)
$col_caps             = rgba(fbbf24FF)
$col_fail             = rgba(f87171FF)
$col_overlay          = rgba(00000044)

$font_display         = Gabarito
$font_body            = Rubik Light
$font_mono            = JetBrainsMono Nerd Font
$font_symbols         = Material Symbols Rounded

$wallpaper            = /home/user/hyper-arch/wallpapers/996764.jpg
$helpers              = /home/user/.config/hypr/hyprlock

general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
}

animations {
    enabled = true
    bezier = quick,        0.15, 1.00, 0.10, 1.00
    bezier = expressive,   0.30, 0.00, 0.10, 1.00
    animation = fadeIn,            1, 5, expressive
    animation = fadeOut,           1, 7, expressive
    animation = inputFieldDots,    1, 2, quick
    animation = inputFieldColors,  1, 4, quick
}

background {
    monitor =
    path = $wallpaper
    blur_size = 12
    blur_passes = 5
    contrast = 0.95
    brightness = 0.55
    vibrancy = 0.18
    vibrancy_darkness = 0.05
}

shape {
    monitor =
    size = 1920, 1080
    position = 0, 0
    halign = center
    valign = center
    color = $col_overlay
    rounding = 0
    border_size = 0
    xray = false
}

shape {
    monitor =
    size = 560, 440
    position = 0, 0
    halign = center
    valign = center
    color = $col_card_fill
    rounding = 28
    border_size = 1
    border_color = $col_card_border
    shadow_passes = 4
    shadow_size = 22
    shadow_color = rgba(00000088)
    shadow_boost = 1.4
}

shape {
    monitor =
    size = 380, 1
    position = 0, 50
    halign = center
    valign = center
    color = $col_card_border
    rounding = 0
    border_size = 0
}

shape {
    monitor =
    size = 80, 4
    position = 0, 192
    halign = center
    valign = center
    color = $col_accent
    rounding = 4
    border_size = 0
}

label {
    monitor =
    text = $TIME
    color = $col_text
    font_size = 88
    font_family = $font_mono
    position = 0, 130
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(00000066)
}

label {
    monitor =
    text = cmd[update:60000] date +"%A · %B %-d"
    color = $col_text_dim
    font_size = 16
    font_family = $font_body
    position = 0, 78
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] $helpers/greeting.sh
    color = $col_accent_2
    font_size = 17
    font_family = $font_display
    position = 0, 28
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = $col_text
    font_size = 38
    font_family = $font_display Bold
    position = 0, -8
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 420, 56
    outline_thickness = 2
    dots_size = 0.28
    dots_spacing = 0.35
    dots_center = true
    dots_rounding = -1

    inner_color = rgba(00000077)
    outer_color = $col_card_border
    check_color = $col_accent
    fail_color = $col_fail
    capslock_color = $col_caps
    numlock_color = $col_accent_2
    bothlock_color = $col_caps
    invert_numlock = false

    font_color = $col_text
    fade_on_empty = false
    fade_timeout = 2000
    placeholder_text = <span foreground="##8a93af"><i>password</i></span>
    hide_input = false
    rounding = 14

    fail_text = <span>auth failed ($ATTEMPTS)</span>

    position = 0, -100
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:250] $helpers/check-capslock.sh
    color = $col_caps
    font_size = 13
    font_family = $font_body
    position = 0, -160
    halign = center
    valign = center
}

shape {
    monitor =
    size = 360, 36
    position = 30, -30
    halign = left
    valign = top
    color = $col_chip_fill
    rounding = 12
    border_size = 1
    border_color = $col_chip_border
}

label {
    monitor =
    text = cmd[update:30000] $helpers/sysline.sh
    color = $col_text_dim
    font_size = 11
    font_family = $font_mono
    position = 48, -42
    halign = left
    valign = top
}

shape {
    monitor =
    size = 160, 36
    position = -30, -30
    halign = right
    valign = top
    color = $col_chip_fill
    rounding = 12
    border_size = 1
    border_color = $col_chip_border
}

label {
    monitor =
    text = cmd[update:1800000] $helpers/weather.sh
    color = $col_text_dim
    font_size = 12
    font_family = $font_mono
    position = -48, -42
    halign = right
    valign = top
}

label {
    monitor =
    text =     enter password to unlock
    color = $col_text_subtle
    font_size = 10
    font_family = $font_body
    position = 0, 30
    halign = center
    valign = bottom
}
