# JarvOS shell overrides. Application and workspace bindings stay in keybinds.conf.
unbind = Super, Space
bindd = Super, Space, Aplicativos, exec, jarvos-shell apps
bindr = Super, Super_L, exec, jarvos-shell menu
unbind = Super, N
bindd = Super, N, Notificacoes, exec, jarvos-shell notifications
unbind = Super, K
bindd = Super, K, Menu JarvOS, exec, jarvos-shell menu
unbind = Super, D
bindd = Super, D, Desktop, exec, jarvos-shell menu desktop
unbind = Super, I
bindd = Super, I, Configuracoes, exec, jarvos-shell menu desktop
unbind = Super, U
bind = Super, U, moveoutofgroup
bindd = Super+Shift, U, Ferramentas JarvOS, exec, jarvos-shell menu jarvos
unbind = Super, H
bindd = Super, H, Atalhos, exec, kitty -e sh -c 'hyprctl binds | less'
unbind = Super, V
bindd = Super, V, Clipboard, exec, jarvos-shell clipboard
unbind = Super, Period
bindd = Super, Period, Emoji, exec, jarvos-shell emoji
unbind = Ctrl+Alt, C
bindl = Ctrl+Alt, C, exec, jarvos-shell clear
unbind = Super+Shift, O
bindd = Super+Shift, O, Audio, exec, jarvos-shell audio
unbind = Ctrl+Alt, Delete
bindd = Ctrl+Alt, Delete, Sessao, exec, jarvos-shell menu system
unbind = Super+Ctrl+Alt, W
bindd = Super+Ctrl+Alt, W, Wallpaper, exec, jarvos-shell wallpaper
unbind = Super+Ctrl+Alt, T
bindd = Super+Ctrl+Alt, T, Tema, exec, jarvos-shell theme
unbind = Super+Ctrl+Alt, Y
bindd = Super+Ctrl+Alt, Y, Tema JarvOS, exec, jarvos-shell theme jarvos
unbind = , XF86MonBrightnessUp
bindl = , XF86MonBrightnessUp, exec, brightnessctl set +5%
unbind = , XF86MonBrightnessDown
bindl = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
unbind = Ctrl+Super, Space
bindl = Ctrl+Super, Space, exec, playerctl play-pause
unbind = , XF86AudioPlay
bindl = , XF86AudioPlay, exec, playerctl play-pause
unbind = , XF86AudioPause
bindl = , XF86AudioPause, exec, playerctl play-pause
unbind = , XF86AudioNext
bindl = , XF86AudioNext, exec, playerctl next
unbind = , XF86AudioPrev
bindl = , XF86AudioPrev, exec, playerctl previous
