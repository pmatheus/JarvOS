# ╔══════════════════════════════════════════════════════════════╗
# ║  JarvOS Custom Keybind Overrides                           ║
# ║  Loaded AFTER upstream keybinds.conf                       ║
# ╚══════════════════════════════════════════════════════════════╝

# Launcher: Super+Space opens Caelestia launcher (with file search + modifier actions)
unbind = Super, Space
bindd = Super, Space, Launcher, global, caelestia:launcher

# Move togglefloating to Super+Y (upstream had layoutmsg togglesplit there)
unbind = Super, Y
bind = Super, Y, togglefloating, # Float/Tile

# Browser priority: Google Chrome first
unbind = Super, W
bind = Super, W, exec, ~/.config/hypr/hyprland/scripts/launch_first_available.sh "google-chrome-stable" "zen-browser" "firefox" "brave" "chromium" "microsoft-edge-stable" "opera" # Browser

#!
##! MAS-Hunt Lab
bindd = Super+Alt, 1, DC01 Server (RDP), exec, ~/.config/hypr/hyprland/scripts/rdp-lab.sh dc01 # DC01 (RDP)
bindd = Super+Alt, 2, WS01 Client (RDP), exec, ~/.config/hypr/hyprland/scripts/rdp-lab.sh ws01 # WS01 (RDP)
bindd = Super+Alt, 3, WS02 Client (RDP), exec, ~/.config/hypr/hyprland/scripts/rdp-lab.sh ws02 # WS02 (RDP)

# Move focused window to adjacent workspace, matching Ctrl+Super+Left/Right navigation
unbind = Ctrl+Super+Alt, Left
unbind = Ctrl+Super+Alt, Right
bind = Ctrl+Super+Alt, Left, movetoworkspace, r-1 # Move window to previous workspace
bind = Ctrl+Super+Alt, Right, movetoworkspace, r+1 # Move window to next workspace

#!
##! Network
# Network settings GUI (nm-connection-editor); reapplies edits to live devices on close
bindd = Super+Shift, N, Network settings, exec, ~/.config/hypr/hyprland/scripts/network-settings.sh # Network settings (GUI)
